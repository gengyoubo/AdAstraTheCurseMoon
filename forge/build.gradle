apply plugin: 'com.github.johnrengelman.shadow'

architectury {
    platformSetupLoomIde()
    forge()
}

loom {
    runs {
        client {
            runDir '../run'
        }
        server {
            runDir '../run'
        }
    }
    forge {
        mixinConfig "ad_ssc.mixins.json"
    }
}

configurations {
    common
    shadowCommon
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentForge.extendsFrom common
}

dependencies {
    forge "net.minecraftforge:forge:${rootProject.minecraft_version}-${rootProject.forge_version}"
    modApi "dev.architectury:architectury-forge:${rootProject.architectury_version}"

    // Load before dependency mixins are applied, and bundle it for installed clients/servers.
    implementation(include("io.github.llamalad7:mixinextras-forge:${rootProject.mixinextras_version}"))
    modImplementation "curse.maven:ad-astra-635042:${rootProject.ad_astra_forge_file}"
    modImplementation "curse.maven:shape-shifter-curse-forge-1683902:${rootProject.shape_shifter_curse_forge_file}"
    modRuntimeOnly 'curse.maven:resourceful-lib-570073:5659871'
    modRuntimeOnly 'curse.maven:resourceful-config-714059:6231176'
    modRuntimeOnly 'curse.maven:geckolib-388172:8285794'
    modImplementation 'curse.maven:botarium-704113:5486070'
    modRuntimeOnly "curse.maven:jei-238222:${rootProject.jei_forge_file}"
    modRuntimeOnly "curse.maven:mezzconfig-1689768:9048661"
    // Jade's StringRenderOutputMixin shadows Font$StringRenderOutput.this$0 by name. Loom's Mojang
    // mappings leave that synthetic field as field_24240, so Jade crashes in this dev runtime (production
    // Forge is fine). Opt in with -PwithJade=true once the mappings name it this$0.
    if (providers.gradleProperty('withJade').map { it.toBoolean() }.getOrElse(false)) {
        modRuntimeOnly "maven.modrinth:jade:${rootProject.jade_forge_version}"
    }
    // GeckoLib ships mclib as a jar-in-jar (com.eliotlash.mclib:mclib:20), which is not
    // unpacked onto the classpath in the Loom dev environment, so add it explicitly.
    forgeRuntimeLibrary 'com.eliotlash.mclib:mclib:20'

    // Ad Astra's upstream Loom setup exposes these Java libraries to Forge's game classloader.
    forgeRuntimeLibrary 'com.teamresourceful:bytecodecs:1.0.2'
    forgeRuntimeLibrary 'com.teamresourceful:yabn:1.0.3'
    forgeRuntimeLibrary 'javazoom:jlayer:1.0.1'

    common(project(path: ':common', configuration: 'namedElements')) { transitive = false }
    shadowCommon(project(path: ':common', configuration: 'transformProductionForge')) { transitive = false }
}

shadowJar {
    configurations = [project.configurations.shadowCommon]
    archiveClassifier = 'dev-shadow'
    exclude 'architectury.common.json'
}

remapJar {
    inputFile.set shadowJar.archiveFile
    dependsOn shadowJar
}

sourcesJar {
    from project(':common').sourceSets.main.allSource
}

components.java.withVariantsFromConfiguration(configurations.shadowRuntimeElements) { skip() }
