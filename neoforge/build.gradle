apply plugin: 'com.gradleup.shadow'

architectury {
    platformSetupLoomIde()
    neoForge()
}

loom {
    runs {
        client { runDir '../run/1.21.1/neoforge' }
        server { runDir '../run/1.21.1/neoforge' }
    }
}

configurations {
    common
    shadowCommon
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common
}

dependencies {
    neoForge "net.neoforged:neoforge:${rootProject.neoforge_version}"
    modApi "dev.architectury:architectury-neoforge:${rootProject.architectury_version}"

    modImplementation "maven.modrinth:ad-astra:${rootProject.ad_astra_neoforge_version}"
    modRuntimeOnly("com.teamresourceful.resourcefullib:resourcefullib-neoforge-1.21:${rootProject.resourceful_lib_version}") { transitive = false }
    modRuntimeOnly("com.teamresourceful.resourcefulconfig:resourcefulconfig-neoforge-1.21:${rootProject.resourceful_config_version}") { transitive = false }
    modRuntimeOnly "maven.modrinth:common-storage-lib:${rootProject.common_storage_lib_neoforge_version}"
    forgeRuntimeLibrary 'javazoom:jlayer:1.0.1'
    // Add native NeoForge SSC here once its dependency is available.

    common(project(path: ':common', configuration: 'namedElements')) { transitive = false }
    shadowCommon(project(path: ':common', configuration: 'transformProductionNeoForge')) { transitive = false }
}

shadowJar {
    configurations = [project.configurations.shadowCommon]
    archiveClassifier = 'dev-shadow'
    exclude 'architectury.common.json'
    exclude 'fabric.mod.json'
}

remapJar {
    inputFile.set shadowJar.archiveFile
    dependsOn shadowJar
}

sourcesJar {
    from project(':common').sourceSets.main.allSource
}

components.java.withVariantsFromConfiguration(configurations.shadowRuntimeElements) { skip() }
