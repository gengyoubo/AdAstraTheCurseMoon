plugins {
    id 'base'
    id 'architectury-plugin' version '3.5.170'
    id 'dev.architectury.loom' version '1.17.493' apply false
    id 'com.gradleup.shadow' version '9.6.1' apply false
}

architectury {
    minecraft = minecraft_version
}

allprojects {
    group = rootProject.mod_group_id
    version = rootProject.mod_version
}

subprojects {
    apply plugin: 'java'
    apply plugin: 'architectury-plugin'
    apply plugin: 'dev.architectury.loom'
    apply plugin: 'maven-publish'

    base {
        archivesName = "${rootProject.mod_id}-${project.name}-${rootProject.minecraft_version}"
    }

    repositories {
        mavenCentral()
        exclusiveContent {
            forRepository { maven { url = 'https://maven.architectury.dev/' } }
            filter { includeGroupByRegex 'dev\\.architectury.*' }
        }
        exclusiveContent {
            forRepository { maven { url = 'https://maven.fabricmc.net/' } }
            filter { includeGroupByRegex 'net\\.fabricmc.*' }
        }
        exclusiveContent {
            forRepository { maven { url = 'https://maven.teamresourceful.com/repository/maven-public/' } }
            filter { includeGroupByRegex 'com\\.teamresourceful.*' }
        }
        exclusiveContent {
            forRepository { maven { url = 'https://cursemaven.com' } }
            filter { includeGroup 'curse.maven' }
        }
        exclusiveContent {
            forRepository { maven { url = 'https://api.modrinth.com/maven' } }
            filter { includeGroup 'maven.modrinth' }
        }
    }

    loom {
        silentMojangMappingsLicense()
    }

    dependencies {
        minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"
        mappings loom.officialMojangMappings()
    }

    java {
        toolchain.languageVersion = JavaLanguageVersion.of(21)
        withSourcesJar()
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.release = 21
    }

    tasks.withType(ProcessResources).configureEach {
        def properties = [
            mod_id: rootProject.mod_id,
            mod_name: rootProject.mod_name,
            mod_version: rootProject.mod_version,
            mod_license: rootProject.mod_license,
            mod_authors: rootProject.mod_authors,
            mod_description: rootProject.mod_description,
            minecraft_version: rootProject.minecraft_version,
            architectury_version: rootProject.architectury_version,
            fabric_loader_version: rootProject.fabric_loader_version
        ]
        inputs.properties properties
        filesMatching(['META-INF/neoforge.mods.toml', 'fabric.mod.json', 'pack.mcmeta']) {
            expand properties
        }
    }
}

tasks.named('build') {
    dependsOn ':neoforge:build', ':fabric:build'
}

tasks.named('clean') {
    dependsOn subprojects.collect { "${it.path}:clean" }
}
