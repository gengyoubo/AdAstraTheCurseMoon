plugins {
    id 'base'
    id 'architectury-plugin' version '3.4.164'
    id 'dev.architectury.loom' version '1.10.455' apply false
    id 'com.github.johnrengelman.shadow' version '8.1.1' apply false
}

architectury {
    minecraft = minecraft_version
}

allprojects {
    group = rootProject.mod_group_id
    version = rootProject.mod_version
}

subprojects {
    apply plugin: 'java'
    apply plugin: 'architectury-plugin'
    apply plugin: 'dev.architectury.loom'
    apply plugin: 'maven-publish'

    base {
        archivesName = "${rootProject.mod_id}-${project.name}-${rootProject.minecraft_version}"
    }

    repositories {
        mavenCentral()
        maven {
            url = 'https://maven.blamejared.com/'
            content { includeGroup 'mezz.jei' }
        }
        maven { url = 'https://maven.architectury.dev/' }
        maven { url = 'https://maven.teamresourceful.com/repository/maven-public/' }
        maven { url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/' }
        exclusiveContent {
            forRepository { maven { url = 'https://cursemaven.com' } }
            filter { includeGroup 'curse.maven' }
        }
        exclusiveContent {
            forRepository { maven { url = 'https://api.modrinth.com/maven' } }
            filter { includeGroup 'maven.modrinth' }
        }
    }

    loom {
        silentMojangMappingsLicense()
    }

    dependencies {
        minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"
        mappings loom.officialMojangMappings()
    }

    java {
        toolchain.languageVersion = JavaLanguageVersion.of(17)
        withSourcesJar()
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.release = 17
    }

    // Shared development classes use named methods. Loading their intermediary refmap
    // during a Forge dev run makes Mixin look for Fabric's class_1657 instead of Player.
    // Only production jars need the refmap; remapJar converts it to the loader's namespace.
    plugins.withId('com.github.johnrengelman.shadow') {
        tasks.named('shadowJar') {
            filesMatching('ad_ssc.mixins.json') {
                filter { line ->
                    line == '{' ? '{\n  "refmap": "ad_ssc-common-refmap.json",' : line
                }
            }
        }
    }

    tasks.withType(ProcessResources).configureEach {
        def properties = [
            mod_id: rootProject.mod_id,
            mod_name: rootProject.mod_name,
            mod_version: rootProject.mod_version,
            mod_license: rootProject.mod_license,
            mod_authors: rootProject.mod_authors,
            mod_description: rootProject.mod_description,
            minecraft_version: rootProject.minecraft_version,
            architectury_version: rootProject.architectury_version,
            fabric_loader_version: rootProject.fabric_loader_version
        ]
        inputs.properties properties
        filesMatching(['META-INF/mods.toml', 'fabric.mod.json', 'pack.mcmeta']) {
            expand properties
        }
    }
}

tasks.named('build') {
    dependsOn ':forge:build', ':fabric:build'
}

tasks.named('clean') {
    dependsOn subprojects.collect { "${it.path}:clean" }
}

tasks.register('verifyMixinPackaging') {
    dependsOn ':forge:remapJar', ':fabric:remapJar'
    inputs.file('common/src/main/resources/ad_ssc.mixins.json')
    inputs.files(project(':forge').tasks.named('remapJar').flatMap { it.archiveFile },
        project(':fabric').tasks.named('remapJar').flatMap { it.archiveFile })
    doLast {
        def parser = new groovy.json.JsonSlurper()
        def devConfig = parser.parse(file('common/src/main/resources/ad_ssc.mixins.json'))
        if (devConfig.containsKey('refmap')) {
            throw new GradleException('Development mixin config must not reference the intermediary refmap')
        }
        ['forge', 'fabric'].each { platform ->
            def artifact = project(":${platform}").tasks.named('remapJar').get().archiveFile.get().asFile
            new java.util.zip.ZipFile(artifact).withCloseable { zip ->
                def config = parser.parse(zip.getInputStream(zip.getEntry('ad_ssc.mixins.json')))
                if (config.refmap != 'ad_ssc-common-refmap.json') {
                    throw new GradleException("Missing production refmap in ${platform} jar")
                }
                def refmap = parser.parse(zip.getInputStream(zip.getEntry(config.refmap)))
                def injections = refmap.mappings['github/com/gengyoubo/adssc/mixin/PlayerRadiationMixin']
                ['addAdditionalSaveData', 'readAdditionalSaveData'].each { method ->
                    def target = injections[method]
                    def expected = platform == 'forge' ? 'Lnet/minecraft/world/entity/player/Player;m_' : 'Lnet/minecraft/class_1657;method_'
                    if (!(target instanceof String) || !target.startsWith(expected)) {
                        throw new GradleException("Wrong ${platform} namespace for ${method}: ${target}")
                    }
                }
            }
        }
        logger.lifecycle('Mixin packaging verified: named development config, SRG Forge refmap, intermediary Fabric refmap')
    }
}

tasks.named('check') {
    dependsOn verifyMixinPackaging
}
