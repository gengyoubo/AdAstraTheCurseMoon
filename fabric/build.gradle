apply plugin: 'com.github.johnrengelman.shadow'

architectury {
    platformSetupLoomIde()
    fabric()
}

repositories {
    exclusiveContent {
        forRepository { maven { url = 'https://jitpack.io' } }
        filter { includeModule 'com.github.Virtuoel', 'KanosConfig' }
    }
    maven {
        url = 'https://maven.ladysnake.org/releases'
        content {
            includeGroup 'io.github.apace100'
            includeGroup 'io.github.ladysnake'
            includeGroup 'dev.onyxstudios.cardinal-components-api'
        }
    }
    maven {
        url = 'https://maven.shedaniel.me'
        content { includeGroupByRegex 'me\\.shedaniel.*' }
    }
    maven {
        url = 'https://maven.jamieswhiteshirt.com/libs-release'
        content { includeGroup 'com.jamieswhiteshirt' }
    }
}

configurations {
    common
    shadowCommon
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common
}

dependencies {
    modImplementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
    modApi "net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_api_version}"
    modApi "dev.architectury:architectury-fabric:${rootProject.architectury_version}"

    modImplementation "curse.maven:ad-astra-635042:${rootProject.ad_astra_fabric_file}"
    modImplementation "maven.modrinth:shape-shifter-curse:${rootProject.shape_shifter_curse_fabric_version}"
    modRuntimeOnly "com.teamresourceful.resourcefullib:resourcefullib-fabric-1.20.1:${rootProject.resourceful_lib_version}"
    modRuntimeOnly "com.teamresourceful.resourcefulconfig:resourcefulconfig-fabric-1.20.1:${rootProject.resourceful_config_version}"
    modRuntimeOnly "earth.terrarium.botarium:botarium-fabric-1.20.1:${rootProject.botarium_version}"
    modRuntimeOnly "maven.modrinth:pehkui:${rootProject.pehkui_version}"
    // Loom's development classpath needs Pehkui's nested dependency explicitly.
    modRuntimeOnly("com.github.Virtuoel:KanosConfig:${rootProject.kanos_config_version}") { transitive = false }
    modRuntimeOnly "maven.modrinth:satin-api:${rootProject.satin_version}"
    modRuntimeOnly "maven.modrinth:jei:${rootProject.jei_fabric_version}"
    modRuntimeOnly "maven.modrinth:jade:${rootProject.jade_fabric_version}"

    // SSC extends Apoli/Calio classes. Loom needs this hierarchy on the compile
    // classpath to remap inherited methods and synthetic bridges correctly.
    modImplementation("io.github.apace100:apoli:2.9.2+mc.1.20.x") {
        exclude group: 'net.fabricmc'
        exclude group: 'net.fabricmc.fabric-api'
        exclude group: 'com.terraformersmc'
        exclude group: 'com.demonwav.mcdev'
    }
    modImplementation 'maven.modrinth:azurelib:3KvekWCR' // Fabric 1.20.1, 3.0.19
    modImplementation 'maven.modrinth:playeranimator:yDqYTUaf' // Fabric 1.20, 1.0.2-rc1
    modImplementation 'com.jamieswhiteshirt:reach-entity-attributes:2.4.0'

    common(project(path: ':common', configuration: 'namedElements')) { transitive = false }
    shadowCommon(project(path: ':common', configuration: 'transformProductionFabric')) { transitive = false }
}

shadowJar {
    configurations = [project.configurations.shadowCommon]
    archiveClassifier = 'dev-shadow'
    exclude 'architectury.common.json'
}

remapJar {
    inputFile.set shadowJar.archiveFile
    dependsOn shadowJar
}

sourcesJar {
    from project(':common').sourceSets.main.allSource
}

components.java.withVariantsFromConfiguration(configurations.shadowRuntimeElements) { skip() }
