architectury {
    common rootProject.enabled_platforms.split(',')
}

dependencies {
    // Loader is used only for environment annotations in shared code.
    modImplementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
    modApi "dev.architectury:architectury:${rootProject.architectury_version}"
    // Ad Astra's shared API is identical on both loaders. Never package this dependency.
    modCompileOnly "maven.modrinth:ad-astra:${rootProject.ad_astra_fabric_version}"
}
