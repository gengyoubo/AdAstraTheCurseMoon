architectury {
    common rootProject.enabled_platforms.split(',')
}

loom {
    mixin {
        defaultRefmapName = "ad_ssc-common-refmap.json"
    }
}

dependencies {
    // Loader is used only for environment annotations in shared code.
    modImplementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
    modApi "dev.architectury:architectury:${rootProject.architectury_version}"
    // Ad Astra's shared API is identical on both loaders. Never package this dependency.
    modCompileOnly "curse.maven:ad-astra-635042:${rootProject.ad_astra_fabric_file}"
}
